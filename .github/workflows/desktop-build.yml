name: Desktop build

# A push whose head-commit subject carries a release version ("release 0.1.8",
# matching src-tauri/tauri.conf.json) builds and publishes a GitHub Release.
# Other pushes do not build. Manual dispatch keeps the legacy semantics: a
# version input releases after building; an empty one only uploads artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version (e.g. v0.1.1). Leave empty to only upload artifacts, no GitHub Release.'
        required: false
        default: ''

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      run_builds: ${{ steps.resolve.outputs.run_builds }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          CONF=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          V="$DISPATCH_VERSION"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "push" ]; then
            V=$(git log -1 --format=%s | sed -nE 's/.*release[ ]+v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          echo "event=${{ github.event_name }} conf=$CONF requested=$V"
          if [ -n "$V" ]; then
            V="${V#v}"
            if [ "$V" != "$CONF" ]; then
              echo "::error::release version $V does not match tauri.conf.json ($CONF); bump tauri.conf.json and push first"
              exit 1
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$V" ]; then
            echo "run_builds=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_builds=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [resolve]
    if: needs.resolve.outputs.run_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            node-arch: darwin-arm64
            target: aarch64-apple-darwin
          - arch: x64
            node-arch: darwin-x64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Add build target
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage bundled resources
        env:
          NODE_ARCH: ${{ matrix.node-arch }}
        run: bash scripts/stage-resources.sh
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build
        run: tauri build --target ${{ matrix.target }}
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  windows:
    name: Windows (nsis)
    needs: [resolve]
    if: needs.resolve.outputs.run_builds == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage bundled resources
        shell: pwsh
        run: ./scripts/stage-resources.ps1
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build
        shell: pwsh
        run: tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub Release
    if: needs.resolve.outputs.version != ''
    needs: [resolve, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "DeepSeek Harness $VERSION" \
            --generate-notes
