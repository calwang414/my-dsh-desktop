name: Desktop build

on:
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            node-arch: darwin-arm64
            target: aarch64-apple-darwin
          - arch: x64
            node-arch: darwin-x64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Add build target
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage bundled resources
        env:
          NODE_ARCH: ${{ matrix.node-arch }}
        run: bash scripts/stage-resources.sh
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build
        run: tauri build --target ${{ matrix.target }}
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  windows:
    name: Windows (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage bundled resources
        shell: pwsh
        run: ./scripts/stage-resources.ps1
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build
        shell: pwsh
        run: tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/nsis/*.exe
