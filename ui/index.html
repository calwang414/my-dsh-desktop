<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0e1116; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; }
    .spinner { width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #30363d; border-top-color: #4d9fff;
      animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; opacity: 0.75; }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <p>Starting DeepSeek Harness…</p>
  </main>
</body>
</html>
