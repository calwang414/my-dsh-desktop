[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell for the DeepSeek Harness Web GUI"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
